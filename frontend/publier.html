<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publier un produit</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="homepage.html">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="main-content">
        <h1 class="main-title">Publier un produit</h1>
        <form action="/publier" method="post" class="product-form">
            <label for="nom">Nom du produit:</label>
            <input type="text" id="nom" name="nom" required>

            <label for="description">Description:</label>
            <textarea id="description" name="description" required></textarea>

            <label for="prix">Prix:</label>
            <input type="number" id="prix" name="prix" step="0.01" required>

            <label for="quantite">Quantité disponible:</label>
            <input type="number" id="quantite" name="quantite" required>

            <label for="ville">Ville:</label>
            <input type="text" id="ville" name="ville" required>

            <label for="latitude">Latitude:</label>
            <input type="number" id="latitude" name="latitude" step="0.0001" required>

            <label for="longitude">Longitude:</label>
            <input type="number" id="longitude" name="longitude" step="0.0001" required>

            <label for "date">Date:</label>
            <input type "date" id "date" name "date" required>

            <button type "submit">Publier</button>
        </form>
    </main>
    <footer class="footer">
        <p>&copy; 2026 fermgeo. Tous droits réservés.</p>
    </footer>
</body>
</html>
